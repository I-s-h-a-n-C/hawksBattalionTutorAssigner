<!-- Template ID: template_request_matched -->
<!-- Subject: {{event_title}} -->
<!-- To: {{to_email}} -->
<div style="font-family: Arial, sans-serif; color:#222; line-height:1.5;">
  <h2 style="color:#c41e3a;">{{event_title}}</h2>
  <p>Hi {{student_name}},</p>
  <p>{{event_summary}}</p>
  <p>
    <strong>Tutor:</strong> {{staff_name}}<br>
    <strong>Request status:</strong> {{status}}<br>
    <strong>Contact email:</strong> <a href="mailto:{{staff_email}}">{{staff_email}}</a>
  </p>
  <p>Please check the app for any additional updates.</p>
  <p>Thanks,<br>Hawks Battalion Tutoring</p>
</div>
